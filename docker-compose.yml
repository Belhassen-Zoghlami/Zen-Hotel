name: zen-hotel

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - MONGO_URI=mongodb://mongo:27017/hotel_booking
      - PORT=3000
      - JWT_SECRET=dev-compose-jwt-secret-change-me
      - JWT_EXPIRES_IN=7d
      - ADMIN_EMAIL=admin@zenhotel.local
      - ADMIN_PASSWORD=ChangeMe123!
      - FRONTEND_URL=http://localhost:4200
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    volumes:
      - ./backend/images:/app/images

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mongo_data:
