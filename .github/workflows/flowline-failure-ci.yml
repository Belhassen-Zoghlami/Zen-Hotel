name: FlowLine Failure Demo

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Failure scenario to emit
        required: true
        default: dependency
        type: choice
        options:
          - dependency
          - import
          - syntax
          - test
          - timeout
          - build
          - unclassified
  push:
    branches: [failure-demo] # change to [main, master] if you want every push

jobs:
  emit-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCENARIO: ${{ inputs.scenario || 'dependency' }}
    steps:
      - uses: actions/checkout@v4

      - name: Emit ${{ env.SCENARIO }} failure
        run: |
          case "$SCENARIO" in
            dependency)
              mkdir -p /tmp/demo-dep
              cd /tmp/demo-dep
              npm install this-package-does-not-exist-xyz@9.9.9 --no-audit --no-fund
              ;;
            import)
              node -e "require('module-does-not-exist-xyz')"
              ;;
            syntax)
              printf 'const = ;\n' > /tmp/broken.js
              node -c /tmp/broken.js
              ;;
            test)
              node -e "const assert = require('node:assert'); assert.equal(1, 2, 'expected equal values')"
              ;;
            timeout)
              echo "Error: timeout while waiting for service" >&2
              exit 1
              ;;
            build)
              echo "error TS1005: ',' expected." >&2
              exit 1
              ;;
            unclassified)
              echo "##[error]Renderer stopped with status 7" >&2
              exit 1
              ;;
            *)
              echo "unknown scenario: $SCENARIO" >&2
              exit 1
              ;;
          esac
